<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="stylesheet" href="/dev/styles/main.css">
</head>
<body>
    <main>
        <h1>Sorteador</h1>
        <form id="sortnum">
            <div>
                <label for="numero-maximo">Digite o número máximo</label>
                <input type="number" id="numero-maximo" required min="2" value="2" step="1"> 
            </div>
            <button type="submit" > Sortear</button>
        </form>
    </main>

    <div class="resultado">
        O número sorteado foi: 
        <br />
        <span id="resultado-valor"></span>
    </div>
    
    
</body>
<script src="/dist/scripts/main.min.js"></script>
</html>
